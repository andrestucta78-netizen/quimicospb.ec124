    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(
                180deg,
                #eeeeee,
                #d6d6d6

        h2 {
            text-align: center;

            font-size: 25px;

        }

        nav a {
            display: block;
            background: #171717;

            margin-bottom: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav a:hover {
            background: #d40000;
            color: white;
        }
