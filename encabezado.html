                #111111,

            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            border: 3px solid #e50914;

        }

        h1 {
            font-size: 34px;

        }

        p {
            font-size: 17px;
        }

        @media (max-width: 600px) {
            img {
                width: 70px;
                height: 70px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 13px;
            }
        }

</head>
